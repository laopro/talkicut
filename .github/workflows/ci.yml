name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || brew upgrade ffmpeg
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix)/bin/ffmpeg" -hide_banner -version | head -1
          "$(brew --prefix)/bin/ffmpeg" -hide_banner -filters | grep -E ' (ass|drawtext|boxblur|loudnorm) ' || true

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Doctor
        run: python scripts/talkicut.py doctor --json

      # --tts none keeps CI offline and deterministic; the caption and encode
      # paths are identical to a real render, only the voice is skipped.
      - name: Render end to end
        run: python scripts/talkicut.py selftest --tts none --out build

      - name: Verify the output
        run: python scripts/talkicut.py verify build/clips --json
